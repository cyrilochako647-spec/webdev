<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CineMax</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">CineMax</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <div class="navbar-nav ms-auto align-items-center">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="movies.html">Movies</a>
          <a class="nav-link" href="booking.html">Booking</a>
          <a class="nav-link" href="details.html">Details</a>
          <a class="nav-link" href="contact.html">Contact</a>
          <a class="nav-link" href="Aboutus.html">About Us</a>
          <a class="nav-link" href="signup.html">Sign Up</a>
          <a class="nav-link active" href="signin.html">Sign In</a>
          <button id="themeToggle" class="dark-toggle">🌙 Dark</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-5" style="max-width:480px;">
    <h2 class="section-title">Sign In</h2>
    <p class="text-muted mb-4">Don't have an account? <a href="signup.html" style="color:#e50914;">Sign up</a></p>

    <!-- data-validate tells main.js to check this form before submitting -->
    <form data-validate data-success-msg="✓ Welcome back! You are now signed in.">

      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Your password" required>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="remember">
        <label class="form-check-label text-muted" for="remember">Remember me</label>
      </div>

      <button type="submit" class="btn btn-primary w-100">Sign In</button>

    </form>
  </div>

  <footer>
    <div class="container">
      <p class="mb-1">&copy; 2026 CineMax. All rights reserved.</p>
      <p><a href="contact.html">Contact Us</a> &middot; <a href="Aboutus.html">About</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
