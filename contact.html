<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - CineMax</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">CineMax</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <div class="navbar-nav ms-auto align-items-center">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="movies.html">Movies</a>
          <a class="nav-link" href="booking.html">Booking</a>
          <a class="nav-link" href="details.html">Details</a>
          <a class="nav-link active" href="contact.html">Contact</a>
          <a class="nav-link" href="Aboutus.html">About Us</a>
          <a class="nav-link" href="signup.html">Sign Up</a>
          <a class="nav-link" href="signin.html">Sign In</a>
          <button id="themeToggle" class="dark-toggle">🌙 Dark</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-5" style="max-width:640px;">
    <h2 class="section-title">Contact Us</h2>

    <form data-validate data-success-msg="✓ Message sent! We'll get back to you shortly.">

      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <div class="mb-3">
        <label for="subject" class="form-label">Subject</label>
        <input type="text" class="form-control" id="subject" name="subject" placeholder="How can we help?" required>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Send Message</button>

    </form>

    <hr class="my-5">

    <h4 class="section-title">Contact Information</h4>
    <div class="row g-3">
      <div class="col-md-4">
        <div class="info-card text-center">
          <div style="font-size:1.8rem;">📧</div>
          <p class="mb-0 mt-2"><strong>Email</strong></p>
          <p class="text-muted" style="font-size:.9rem;">support@cinemax.com</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="info-card text-center">
          <div style="font-size:1.8rem;">📞</div>
          <p class="mb-0 mt-2"><strong>Phone</strong></p>
          <p class="text-muted" style="font-size:.9rem;">+254 706 388 508</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="info-card text-center">
          <div style="font-size:1.8rem;">📍</div>
          <p class="mb-0 mt-2"><strong>Address</strong></p>
          <p class="text-muted" style="font-size:.9rem;">Nairobi, Kenya</p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p class="mb-1">&copy; 2026 CineMax. All rights reserved.</p>
      <p><a href="contact.html">Contact Us</a> &middot; <a href="Aboutus.html">About</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
