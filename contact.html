<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - CineMax</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">CineMax</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <div class="navbar-nav ms-auto align-items-center">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="movies.html">Movies</a>
          <a class="nav-link" href="booking.html">Booking</a>
          <a class="nav-link" href="details.html">Details</a>
          <a class="nav-link active" href="contact.html">Contact</a>
          <a class="nav-link" href="Aboutus.html">About Us</a>
          <a class="nav-link" href="signup.html">Sign Up</a>
          <a class="nav-link" href="signin.html">Sign In</a>
          <button id="themeToggle" class="dark-toggle">🌙 Dark</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row">

      <div class="col-md-7">
        <h2 class="section-title">Contact Us</h2>
        <form data-validate data-success-msg="✓ Message sent! We'll get back to you within 24 hours.">
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Your name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" required>
          </div>
          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" class="form-control" id="subject" name="subject" placeholder="How can we help?" required>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>

      <div class="col-md-4 offset-md-1 mt-4 mt-md-0">
        <h2 class="section-title">Get in Touch</h2>
        <div class="info-card mb-3">
          <p>📧 <strong>Email</strong><br>support@cinemax.com</p>
        </div>
        <div class="info-card mb-3">
          <p>📞 <strong>Phone</strong><br>+254 700 000 000</p>
        </div>
        <div class="info-card mb-3">
          <p>📍 <strong>Address</strong><br>Nairobi, Kenya</p>
        </div>
        <div class="info-card">
          <p>🕐 <strong>Support Hours</strong><br>Mon – Fri: 8am – 8pm<br>Sat – Sun: 10am – 6pm</p>
        </div>
      </div>

    </div>
  </div>

  <footer>
    <div class="container">
      <p class="mb-1">&copy; 2026 CineMax. All rights reserved.</p>
      <p><a href="contact.html">Contact Us</a> &middot; <a href="Aboutus.html">About</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
