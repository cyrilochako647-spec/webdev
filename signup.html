<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - CineMax</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">CineMax</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <div class="navbar-nav ms-auto align-items-center">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="movies.html">Movies</a>
          <a class="nav-link" href="booking.html">Booking</a>
          <a class="nav-link" href="details.html">Details</a>
          <a class="nav-link" href="contact.html">Contact</a>
          <a class="nav-link" href="Aboutus.html">About Us</a>
          <a class="nav-link active" href="signup.html">Sign Up</a>
          <a class="nav-link" href="signin.html">Sign In</a>
          <button id="themeToggle" class="dark-toggle">🌙 Dark</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-5" style="max-width:480px;">
    <h2 class="section-title">Create an Account</h2>
    <p class="text-muted mb-4">Already have an account? <a href="signin.html" style="color:#e50914;">Sign in</a></p>

    <form data-validate data-success-msg="✓ Account created! Welcome to CineMax." id="signupForm">

      <div class="mb-3">
        <label for="fullname" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="fullname" name="fullname" placeholder="John Doe" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Min. 6 characters" minlength="6" required>
      </div>

      <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
        <div id="pwMismatch" class="text-danger mt-1" style="font-size:.85rem; display:none;">Passwords do not match.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Sign Up</button>

    </form>
  </div>

  <footer>
    <div class="container">
      <p class="mb-1">&copy; 2026 CineMax. All rights reserved.</p>
      <p><a href="contact.html">Contact Us</a> &middot; <a href="Aboutus.html">About</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
  <script>
    /* Extra: password-match check before main.js validation fires */
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      const pw  = document.getElementById('password').value;
      const cpw = document.getElementById('confirm_password').value;
      const msg = document.getElementById('pwMismatch');
      if (pw !== cpw) {
        e.preventDefault();
        e.stopImmediatePropagation();
        msg.style.display = 'block';
        document.getElementById('confirm_password').focus();
      } else {
        msg.style.display = 'none';
      }
    });
  </script>
</body>
</html>
