<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - CineMax</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">CineMax</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="movies.html">Movies</a>
                <a class="nav-link text-white" href="booking.html">Booking</a>
                <a class="nav-link text-white" href="contact.html">Contact</a>
                <a class="nav-link text-white" href="details.html">Details</a>
                <a class="nav-link text-white" href="Aboutus.html">About Us</a>
                <a class="nav-link text-white" href="signup.html">Sign Up</a>
                <a class="nav-link text-white" href="signin.html">Sign In</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Book Your Tickets</h2>
        <form action="#" method="post">
            <div class="mb-3">
                <label for="movie" class="form-label">Select Movie</label>
                <select class="form-select" id="movie" name="movie" required>
                    <option value="">Choose a movie...</option>
                    <option value="fast_and_furious">Fast and Furious</option>
                    <option value="the_seventh_dwarf">The Seventh Dwarf</option>
                    <option value="train_wreck">Train Wreck</option>
                    <option value="The boys">The boys</option>
                    <option value="The flash">The flash</option>
                    <option value="The batman">The batman</option>
                    <option value="superman">The superman</option>
                    <option value="The avengers">The avengers</option>
                    <option value="The dark knight">The dark knight</option>
                    <optgroup label="Comedy">
                        <option value="The hangover">The hangover</option>
                        <option value="The mask">The mask</option>
                        <option value="The big lebowski">The big lebowski</option>

                    </optgroup>
                    <optgroup label="Action">
                        <option value="John wick">John wick</option>
                        <option value="Mad max">Mad max</option>
                        <option value="Die hard">Die hard</option>          
                        <option value="The matrix">The matrix</option>
                    </optgroup>
                    <optgroup label="Drama">
                        <option value="The godfather">The godfather</option>
                        <option value="Forrest gump">Forrest gump</option>
                        <option value="The shawshank redemption">The shawshank redemption</option>
                    </optgroup>
                    <optgroup label="Horror">       
                        <option value="The shining">The shining</option>
                        <option value="Get out">Get out</option>
                        <option value="A nightmare on elm street">A nightmare on elm street</option>
                    </optgroup>        

                </select>
            </div>
            <div class="mb-3">
                <label for="tickets" class="form-label">Number of Tickets</label>
                <input type="number" class="form-control" id="tickets" name="tickets" min="1" max="10" required>
            </div>
            <button type="submit" class="btn btn-primary">Book Now</button>
        </form>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        &copy; 2026 CineMax. All rights reserved.
    </footer>
